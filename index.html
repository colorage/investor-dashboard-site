<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Returns Dashboard</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header-title">
          <h1>Investment Returns Dashboard</h1>
          <p class="subtitle">Compare stocks and ETFs by period return</p>
        </div>
        <div class="header-status">
          <span id="status-text">Loading…</span>
          <span id="progress-text"></span>
          <button id="refresh-btn" type="button">Refresh</button>
        </div>
      </header>
      <section id="filters" class="filters" aria-label="Growth filters"></section>
      <main id="table-container" class="table-container"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

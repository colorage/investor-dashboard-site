name: Keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# A small monthly commit keeps the daily data refresh in deploy.yml alive.

on:
  schedule:
    - cron: "0 5 1 * *" # 05:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit keepalive timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive [skip ci]"
          git push
